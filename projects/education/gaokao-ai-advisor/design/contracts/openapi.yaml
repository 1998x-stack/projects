openapi: 3.1.0
info:
  title: Gaokao AI Advisor - Proposed MVP API
  version: 0.1.0-draft
  description: |
    Design-only contract, not an implemented or hosted API.
    Exactly one pilot province, one ordinary undergraduate batch, one admission-unit type.
    The service does not submit official applications or guarantee admission.
servers:
  - url: https://api.example.invalid
    description: Placeholder only - NOT a deployed endpoint
security:
  - sessionCookie: []
tags:
  - name: Scope
  - name: Profiles
  - name: Drafts
  - name: Audits
  - name: Exports
  - name: Sources
  - name: Privacy
paths:
  /v1/capabilities:
    get:
      security: []
      tags: [Scope]
      summary: Return supported scope and active source state
      operationId: getCapabilities
      responses:
        '200':
          description: Public supported scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /v1/profiles:
    post:
      tags: [Profiles]
      summary: Create immutable profile snapshot
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/drafts:
    post:
      tags: [Drafts]
      summary: Create versioned ordered draft
      operationId: createDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/drafts/{draft_id}/items:
    put:
      tags: [Drafts]
      summary: Save new ordered draft revision using CAS
      operationId: updateDraftItems
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftItems'
      responses:
        '200':
          description: New revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/drafts/{draft_id}/audits:
    post:
      tags: [Audits]
      summary: Queue an audit of a frozen draft/profile/catalog/rule-pack snapshot
      operationId: queueAudit
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditCreate'
      responses:
        '202':
          description: Queued, not a successful audit verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /v1/audits/{audit_id}:
    get:
      tags: [Audits]
      summary: Read audit status and verified rule summary
      operationId: getAudit
      parameters:
        - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: Current or historical audit status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/audits/{audit_id}/findings:
    get:
      tags: [Audits]
      summary: Read findings plus per-rule coverage and official source refs
      operationId: listAuditFindings
      parameters:
        - $ref: '#/components/parameters/AuditId'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Paged findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/audits/{audit_id}/explanations:
    post:
      tags: [Audits]
      summary: Queue optional, restricted natural-language explanations
      operationId: queueExplanations
      parameters:
        - $ref: '#/components/parameters/AuditId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Explanation generation queued; rule result unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sources/{source_id}:
    get:
      tags: [Sources]
      summary: Authorized official provenance details
      operationId: getSource
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verified source metadata with official allowlisted URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRef'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/drafts/{draft_id}/exports:
    post:
      tags: [Exports]
      summary: Queue a visibly watermarked auxiliary draft for human review
      operationId: queueExport
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreate'
      responses:
        '202':
          description: Export queued, not an official submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/exports/{export_id}:
    get:
      tags: [Exports]
      summary: Read authorized export state and expiring download link
      operationId: getExport
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{workspace_id}:
    delete:
      tags: [Privacy]
      summary: Authorized owner requests workspace deletion
      operationId: requestWorkspaceDeletion
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm:
                  type: string
                  const: DELETE
      responses:
        '202':
          description: Deletion accepted for asynchronous cleanup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Secure, HttpOnly, SameSite cookie after OIDC login; CSRF protection required.
  parameters:
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
    AuditId:
      name: audit_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Conflict:
      description: Revision or input snapshot conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Unsupported scope, invalid admission unit, or missing required input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found or not visible to caller (no resource enumeration)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SourceUnavailable:
      description: Verified current official source not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Scope:
      type: object
      additionalProperties: false
      required: [province, exam_year, batch, admission_unit_type]
      properties:
        province:
          type: string
        exam_year:
          type: integer
          minimum: 2000
        batch:
          type: string
        admission_unit_type:
          type: string
          description: Policy-approved local admission unit type, never inferred globally.
    ScopeStatus:
      type: string
      enum: [CURRENT_VERIFIED, HISTORICAL_ONLY, PARTIAL, OUT_OF_SCOPE]
    EligibilityStatus:
      type: string
      enum: [ELIGIBLE, INELIGIBLE, UNKNOWN]
    AuditRunStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED, STALE]
    OverallReadiness:
      type: string
      enum: [REVIEWABLE, BLOCKED, NEEDS_INPUT, OUT_OF_SCOPE]
    FindingSeverity:
      type: string
      enum: [BLOCKER, WARNING, INFO]
    HistoricalPositionLabel:
      type: string
      enum: [HISTORICAL_AHEAD, HISTORICAL_NEAR, HISTORICAL_BEHIND, INSUFFICIENT_HISTORY, NOT_COMPARABLE]
    CoverageResult:
      type: string
      enum: [PASS, FAIL, UNKNOWN, NOT_APPLICABLE]
    Capabilities:
      type: object
      required: [scopes, official_submission_supported]
      properties:
        scopes:
          type: array
          items:
            type: object
            required: [scope, source_status, current_catalog_id]
            properties:
              scope:
                $ref: '#/components/schemas/Scope'
              source_status:
                $ref: '#/components/schemas/ScopeStatus'
              current_catalog_id:
                type: [string, 'null']
              official_entry_url:
                type: string
                format: uri
        official_submission_supported:
          type: boolean
          const: false
    ProfileCreate:
      type: object
      additionalProperties: false
      required: [scope, subject_selection]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        subject_selection:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        rank:
          type: [integer, 'null']
          minimum: 1
        preferences:
          type: object
          additionalProperties: true
          description: User-declared preferences only, not eligibility conclusions.
    ProfileSnapshot:
      type: object
      required: [profile_snapshot_id, revision, scope]
      properties:
        profile_snapshot_id:
          type: string
        revision:
          type: integer
          minimum: 1
        scope:
          $ref: '#/components/schemas/Scope'
    DraftCreate:
      type: object
      additionalProperties: false
      required: [profile_snapshot_id, scope]
      properties:
        profile_snapshot_id:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
    Draft:
      type: object
      required: [draft_id, revision, profile_snapshot_id, ordered_unit_ids]
      properties:
        draft_id:
          type: string
        revision:
          type: integer
          minimum: 1
        profile_snapshot_id:
          type: string
        ordered_unit_ids:
          type: array
          items:
            type: string
          description: Identifiers preserve official code strings with leading zeros.
    UpdateDraftItems:
      type: object
      additionalProperties: false
      required: [expected_revision, ordered_unit_ids]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        ordered_unit_ids:
          type: array
          uniqueItems: true
          items:
            type: string
    AuditCreate:
      type: object
      additionalProperties: false
      required: [expected_draft_revision, profile_snapshot_id]
      properties:
        expected_draft_revision:
          type: integer
          minimum: 1
        profile_snapshot_id:
          type: string
    AuditAccepted:
      type: object
      required: [audit_id, status, draft_revision, catalog_snapshot_id, rule_pack_id]
      properties:
        audit_id:
          type: string
        status:
          $ref: '#/components/schemas/AuditRunStatus'
        draft_revision:
          type: integer
        catalog_snapshot_id:
          type: string
        rule_pack_id:
          type: string
    AuditUnit:
      type: object
      required: [unit_id, eligibility_status, finding_codes, source_refs, historical_position]
      properties:
        unit_id:
          type: string
        eligibility_status:
          $ref: '#/components/schemas/EligibilityStatus'
        finding_codes:
          type: array
          items:
            type: string
        source_refs:
          type: array
          items:
            type: string
        historical_position:
          $ref: '#/components/schemas/HistoricalPositionLabel'
    AuditResult:
      type: object
      required: [audit_id, status, scope_status, overall_readiness, official_submission_supported, draft_revision, catalog_snapshot_id, rule_pack_id, items, display_disclaimer]
      properties:
        audit_id:
          type: string
        status:
          $ref: '#/components/schemas/AuditRunStatus'
        scope_status:
          $ref: '#/components/schemas/ScopeStatus'
        overall_readiness:
          $ref: '#/components/schemas/OverallReadiness'
        official_submission_supported:
          type: boolean
          const: false
        draft_revision:
          type: integer
        catalog_snapshot_id:
          type: string
        rule_pack_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditUnit'
        display_disclaimer:
          type: string
    RuleCoverage:
      type: object
      required: [unit_id, rule_id, result, source_refs]
      properties:
        unit_id:
          type: string
        rule_id:
          type: string
        result:
          $ref: '#/components/schemas/CoverageResult'
        source_refs:
          type: array
          items:
            type: string
        reason:
          type: string
    Finding:
      type: object
      required: [finding_id, unit_id, code, severity, eligibility_status, source_refs, next_action]
      properties:
        finding_id:
          type: string
        unit_id:
          type: string
        code:
          type: string
        severity:
          $ref: '#/components/schemas/FindingSeverity'
        eligibility_status:
          $ref: '#/components/schemas/EligibilityStatus'
        source_refs:
          type: array
          items:
            type: string
        rule_ids:
          type: array
          items:
            type: string
        next_action:
          type: string
    FindingPage:
      type: object
      required: [findings, coverage, next_cursor]
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        coverage:
          type: array
          items:
            $ref: '#/components/schemas/RuleCoverage'
        next_cursor:
          type: [string, 'null']
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
    SourceRef:
      type: object
      required: [source_id, publisher, official_url, document_version, retrieved_at]
      properties:
        source_id:
          type: string
        publisher:
          type: string
        official_url:
          type: string
          format: uri
        document_version:
          type: string
        section_anchor:
          type: [string, 'null']
        retrieved_at:
          type: string
          format: date-time
        verified_at:
          type: [string, 'null']
          format: date-time
    ExportCreate:
      type: object
      additionalProperties: false
      required: [audit_id, draft_revision]
      properties:
        audit_id:
          type: string
        draft_revision:
          type: integer
          minimum: 1
        format:
          type: string
          enum: [PDF, CSV]
          default: PDF
    ExportAccepted:
      type: object
      required: [export_id, status]
      properties:
        export_id:
          type: string
        status:
          type: string
          enum: [QUEUED]
    ExportStatus:
      type: object
      required: [export_id, status, audit_id, watermark]
      properties:
        export_id:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
        audit_id:
          type: string
        watermark:
          type: string
          const: "辅助志愿草表，仅供核对，不可替代省考试院正式填报"
        download_url:
          type: [string, 'null']
          format: uri
          description: Authenticated, short-expiry link only on COMPLETED.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
              example: SOURCE_NOT_READY
            message:
              type: string
            field:
              type: [string, 'null']
            request_id:
              type: string
            retryable:
              type: boolean
